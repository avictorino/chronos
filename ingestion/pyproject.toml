[project]
name = "chronos-ingestion"
version = "0.1.0"
description = "LLM-driven ingestion pipeline that builds a historical knowledge graph in Postgres + pgvector."
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=3.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "asyncpg>=0.30",
    "ollama>=0.6",
    "openai>=1.50",
    "tenacity>=9.0",
    "rapidfuzz>=3.10",
    "pyyaml>=6.0",
    "google-cloud-firestore>=2.19",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: requires a real Postgres instance (set POSTGRES_DSN to enable; skipped otherwise)",
]
