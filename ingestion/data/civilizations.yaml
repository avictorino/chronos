# Seed list of civilizations to ingest.
#
# These dates are approximate seeds only, not historical authority — the LLM
# may return more refined/disputed ranges when it extracts the CivilizationProfile.
# Years are astronomical/BCE-negative: 701 BCE = -701, 70 CE = 70.
#
# `importance_score` (0-10, subjective) scales how much of each civilization
# actually gets ingested — see app/services/civilization_service.py::scaled_budgets.
# 10 = the full MAX_*_PER_CIVILIZATION budget (Rome/Greece/Egypt-tier: globally
# prominent, richly documented); lower scores shrink the budget toward a
# smaller-but-still-real floor for less prominent/less documented civilizations.
# Adjust freely — it's a judgment call, not a historical ranking.
#
# Deliberately spans every inhabited continent and a wide range of eras, not
# just the Mediterranean/Near East — see spec/01-product-spec.md ("history of
# humanity", not "history of one region").

civilizations:
  # --- Already in progress: kept first so the nightly --shard 0/2 and
  # --shard 1/2 tasks (see ingestion/scripts/) each reach these before
  # anything else — assyria is index 0 (shard 0), babylon is index 1
  # (shard 1), matching the checkpoint DBs each shard resumes from. ---
  - id: assyria
    name: Assyria
    approximate_start_year: -2500
    approximate_end_year: -609
    importance_score: 8

