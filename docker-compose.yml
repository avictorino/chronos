services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: chronos-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chronos
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chronos"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
